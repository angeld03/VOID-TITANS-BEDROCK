name: VOID TITANS - Validate and Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON and cross-pack references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bp = Path('behavior_pack')
          rp = Path('resource_pack')
          files = list(bp.rglob('*.json')) + list(rp.rglob('*.json'))
          for f in files:
              json.loads(f.read_text(encoding='utf-8'))
          bm = json.loads((bp/'manifest.json').read_text())
          rm = json.loads((rp/'manifest.json').read_text())
          assert any(d['uuid'] == bm['header']['uuid'] for d in rm['dependencies'])
          be = json.loads((bp/'entities/void_titan.json').read_text())['minecraft:entity']
          ce = json.loads((rp/'entity/void_titan.entity.json').read_text())['minecraft:client_entity']['description']
          geo = json.loads((rp/'models/entity/void_titan.geo.json').read_text())['minecraft:geometry'][0]['description']['identifier']
          particle = json.loads((rp/'particles/void_spark_aura.particle.json').read_text())['particle_effect']['description']['identifier']
          assert be['description']['identifier'] == ce['identifier']
          assert ce['geometry']['default'] == geo
          assert ce['particle_effects']['void_aura'] == particle
          for f in [rp/'textures/entity/void_titan.png', rp/'textures/particle/void_spark.png', bp/'pack_icon.png', rp/'pack_icon.png']:
              assert f.is_file(), f'Missing {f}'
          print(f'Validated {len(files)} JSON documents and asset references.')
          PY
      - name: Build installable archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          def package(output, folder, prefix):
              with ZipFile(output, 'w', ZIP_DEFLATED) as z:
                  root = Path(folder)
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          name = f'{folder}/{p.relative_to(root)}' if prefix else str(p.relative_to(root))
                          z.write(p, name)
          package('VOID-TITANS-Behavior.mcpack', 'behavior_pack', False)
          package('VOID-TITANS-Resources.mcpack', 'resource_pack', False)
          with ZipFile('VOID-TITANS-BEDROCK.mcaddon', 'w', ZIP_DEFLATED) as z:
              for folder in ['behavior_pack', 'resource_pack']:
                  root = Path(folder)
                  for p in sorted(root.rglob('*')):
                      if p.is_file(): z.write(p, f'{folder}/{p.relative_to(root)}')
          PY
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: void-titans-bedrock-packages
          path: |
            VOID-TITANS-BEDROCK.mcaddon
            VOID-TITANS-Behavior.mcpack
            VOID-TITANS-Resources.mcpack
          if-no-files-found: error
